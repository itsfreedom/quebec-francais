name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for git info
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Cache Quartz plugins
        uses: actions/cache@v6
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-
      - name: Install Dependencies
        run: npm ci
      - name: Install Quartz plugins
        run: npx quartz plugin install
      - name: Make sentences interactive (문장 끝 🔊 · 단어 뜻 말풍선)
        run: python3 scripts/fr_interactive.py content
      - name: Make English site (영문판 · 번역 캐시 i18n/ko-en.json)
        if: false   # 영문판 당분간 정지 (다시 켤 때 이 줄과 아래 if 줄 삭제 + Head.tsx LANG_ON=true)
        run: python3 scripts/en_site.py content content-en
      - name: Build Quartz (한글판)
        run: npx quartz build
      - name: Build Quartz (English → /en/)
        if: false
        run: |
          cp quartz.config.en.yaml quartz.config.yaml
          npx quartz build -d content-en -o public/en
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
